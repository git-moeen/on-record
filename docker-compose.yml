services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      INFONA_URL: ${INFONA_URL:-}
      INFONA_API_KEY: ${INFONA_API_KEY:-}
      INFONA_TENANT: ${INFONA_TENANT:-default}
      INFONA_KG: ${INFONA_KG:-on-record}
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

  enrich:
    image: node:22-bookworm-slim
    profiles: ["enrich"]
    working_dir: /app
    environment:
      INFONA_URL: ${INFONA_URL:-}
      INFONA_API_KEY: ${INFONA_API_KEY:-}
      INFONA_TENANT: ${INFONA_TENANT:-default}
      INFONA_KG: ${INFONA_KG:-on-record}
    volumes:
      - .:/app
    command: sh -c "npm install && npm run enrich"
